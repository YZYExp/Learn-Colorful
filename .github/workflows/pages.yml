name: Publish reading site

on:
  push:
    branches: [main]
    paths:
      - 'chapters/**'
      - 'appendices/**'
      - 'assets/images/**'
      - 'references/palette-studies.json'
      - 'references/visual-cases.json'
      - 'book.json'
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - 'requirements-site.txt'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt
      - name: Install web dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-site.txt'
      - name: Build reading site
        run: python scripts/build_site.py --base-path /${{ github.event.repository.name }}/
      - name: Check links, images, and search coverage
        run: |
          node --check site/app.js
          python scripts/check_site.py --base-path /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: build/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy reading site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
