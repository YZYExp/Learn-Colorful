name: Export EPUB
on:
  push:
    branches: [main]
    paths:
      - 'chapters/**'
      - 'appendices/**'
      - 'assets/images/**'
      - 'book.json'
      - 'scripts/build.py'
      - 'scripts/check_epub.py'
      - 'requirements-ebook.txt'
      - '.github/workflows/ebook.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ebook.txt
      - name: Install export dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-ebook.txt'
      - name: Build and validate EPUB
        run: |
          python scripts/build.py
          python scripts/check_epub.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: color-language-epub
          path: |
            build/*.epub
            build/validation.json
          if-no-files-found: error
          retention-days: 90
